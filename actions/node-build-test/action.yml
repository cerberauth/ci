name: "Node.js Build and Test"
description: "Setup Node.js, install dependencies, check format, lint, and run tests"

inputs:
  node-version-file:
    description: "Path to the Node.js version file (.node-version, .nvmrc, etc.). Auto-detects .node-version then .nvmrc if not specified."
    required: false
    default: ""
  coverage-command:
    description: "Command run after the test step to generate a coverage report (e.g. 'npm run coverage'). Skipped when empty."
    required: false
    default: ""
  codecov:
    description: "Upload coverage to Codecov after the coverage command runs."
    required: false
    default: "false"
  codecov-token:
    description: "Codecov upload token (required for private repositories)."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Detect Node.js version file
      id: detect-node-version-file
      shell: bash
      run: |
        if [ -n "${{ inputs.node-version-file }}" ]; then
          echo "node-version-file=${{ inputs.node-version-file }}" >> $GITHUB_OUTPUT
        elif [ -f ".node-version" ]; then
          echo "node-version-file=.node-version" >> $GITHUB_OUTPUT
        elif [ -f ".nvmrc" ]; then
          echo "node-version-file=.nvmrc" >> $GITHUB_OUTPUT
        else
          echo "node-version-file=.node-version" >> $GITHUB_OUTPUT
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: ${{ steps.detect-node-version-file.outputs.node-version-file }}
        cache: npm

    - name: Install Dependencies
      shell: bash
      run: npm ci

    - name: Check Format
      shell: bash
      run: npm run format:check

    - name: Lint
      shell: bash
      run: npm run lint

    - name: Test
      shell: bash
      run: npm run ci-test

    - name: Coverage
      if: inputs.coverage-command != ''
      shell: bash
      run: ${{ inputs.coverage-command }}

    - name: Upload coverage to Codecov
      if: inputs.coverage-command != '' && inputs.codecov == 'true'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ inputs.codecov-token }}
        fail_ci_if_error: false
