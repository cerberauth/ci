name: "Lint Dockerfile"
description: "Checkout and lint a Dockerfile using Hadolint"

inputs:
  dockerfile:
    description: "Path to the Dockerfile to lint"
    required: false
    default: "Dockerfile"
  ignore:
    description: "A comma separated string of rules to ignore"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Lint Dockerfile 🐳
      uses: hadolint/hadolint-action@v3.5.0
      with:
        dockerfile: ${{ inputs.dockerfile }}
        ignore: ${{ inputs.ignore }}
