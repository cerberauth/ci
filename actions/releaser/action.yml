name: Releaser
description: Publish a project via GoReleaser with Docker, Snapcraft, Homebrew, Scoop, AUR, Winget, nfpm, and Chocolatey

inputs:
  setup-go:
    description: "Set up Go environment before releasing"
    required: false
    default: "true"
  go-version:
    description: "Go version to use (only used when setup-go is true)"
    required: false
    default: "1.27"
  package-name:
    description: "Package name for Snapcraft status check (skip Snapcraft if empty)"
    required: false
    default: ""
  dockerhub-username:
    description: "Docker Hub username"
    required: false
    default: ""
  dockerhub-token:
    description: "Docker Hub token"
    required: false
    default: ""
  snapcraft-store-credentials:
    description: "Snapcraft store credentials (required when package-name is set)"
    required: false
    default: ""
  chocolatey-api-key:
    description: "Chocolatey API key (optional, skip if project does not publish to Chocolatey)"
    required: false
    default: ""
  aur-key:
    description: "AUR SSH private key (optional, skip if project does not publish to AUR)"
    required: false
    default: ""
  github-token:
    description: "GitHub PAT for GoReleaser (Homebrew tap, Scoop bucket, Winget PRs)"
    required: true
  skip:
    description: "Comma-separated GoReleaser publishers to skip (aur,brew,chocolatey,docker,scoop,snapcraft,winget)"
    required: false
    default: ""
  only:
    description: "Publish only to this publisher — skips all others (aur,brew,chocolatey,docker,scoop,snapcraft,winget). Overrides skip."
    required: false
    default: ""
  goreleaser-current-tag:
    description: "Override the current tag used by GoReleaser (GORELEASER_CURRENT_TAG)"
    required: false
    default: ""
  dry-run:
    description: "Run GoReleaser in snapshot mode: builds and packages (incl. local Docker images) without publishing anywhere"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Go environment
      if: ${{ inputs.setup-go == 'true' }}
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Docker Hub
      if: ${{ inputs.dockerhub-username != '' && inputs.dockerhub-token != '' }}
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Install Cosign
      uses: sigstore/cosign-installer@v4.1.3

    - name: Install Syft
      uses: anchore/sbom-action/download-syft@v0

    # https://github.com/goreleaser/goreleaser/issues/1715#issuecomment-667002748
    # https://github.com/goreleaser/goreleaser/issues/4816
    - name: Install Snapcraft
      if: ${{ inputs.package-name != '' && inputs.snapcraft-store-credentials != '' }}
      shell: bash
      # snapd is preinstalled on GitHub-hosted Ubuntu runners; avoid apt so a mirror outage cannot fail the release
      run: |
        sudo snap install snapcraft --classic
        snapcraft status ${{ inputs.package-name }}
        mkdir -p $HOME/.cache/snapcraft/download
        mkdir -p $HOME/.cache/snapcraft/stage-packages
      env:
        SNAPCRAFT_STORE_CREDENTIALS: ${{ inputs.snapcraft-store-credentials }}

    - name: Install Chocolatey
      if: ${{ inputs.chocolatey-api-key != '' }}
      shell: bash
      # choco has no native Linux build: GoReleaser calls `choco pack` / `choco push` from the
      # repository root, so a wrapper runs it from the official image with the workspace mounted
      # at the same path. choco must run as root there (it fails silently otherwise), so files it
      # writes are handed back to the runner user afterwards.
      run: |
        {
          echo '#!/usr/bin/env bash'
          echo "CHOCO_IMAGE=chocolatey/choco:v${CHOCOLATEY_VERSION}-linux"
          cat <<'EOF'
        exec docker run --rm -v "$PWD:$PWD" -w "$PWD" -e OWNER="$(id -u):$(id -g)" "$CHOCO_IMAGE" \
          sh -c 'choco "$@"; rc=$?; chown -R "$OWNER" "$PWD"; exit $rc' choco "$@"
        EOF
        } | sudo tee /usr/local/bin/choco > /dev/null
        sudo chmod +x /usr/local/bin/choco
        docker pull --quiet "chocolatey/choco:v${CHOCOLATEY_VERSION}-linux"
        choco --version
      env:
        CHOCOLATEY_VERSION: 2.7.5

    - name: Compute GoReleaser args
      id: goreleaser-args
      shell: bash
      run: |
        ALL_PUBLISHERS="aur chocolatey docker homebrew ko nfpm nix scoop snapcraft winget"
        SKIP="${{ inputs.skip }}"
        ONLY="${{ inputs.only }}"

        if [ -n "$ONLY" ]; then
          ONLY_LIST=$(echo "$ONLY" | tr ',' ' ')
          SKIP_LIST=""
          for pub in $ALL_PUBLISHERS; do
            found=0
            for only_pub in $ONLY_LIST; do
              [ "$pub" = "$only_pub" ] && found=1 && break
            done
            [ $found -eq 0 ] && SKIP_LIST="${SKIP_LIST:+$SKIP_LIST,}$pub"
          done
          SKIP="$SKIP_LIST"
        else
          # Auto-skip publishers if credentials are missing
          [ -z "${{ inputs.dockerhub-username }}" ] || [ -z "${{ inputs.dockerhub-token }}" ] && [[ ",$SKIP," != *",docker,"* ]] && SKIP="${SKIP:+$SKIP,}docker"
          [ -z "${{ inputs.snapcraft-store-credentials }}" ] && [[ ",$SKIP," != *",snapcraft,"* ]] && SKIP="${SKIP:+$SKIP,}snapcraft"
          [ -z "${{ inputs.chocolatey-api-key }}" ] && [[ ",$SKIP," != *",chocolatey,"* ]] && SKIP="${SKIP:+$SKIP,}chocolatey"
          [ -z "${{ inputs.aur-key }}" ] && [[ ",$SKIP," != *",aur,"* ]] && SKIP="${SKIP:+$SKIP,}aur"
        fi

        if [ "${{ inputs.dry-run }}" = "true" ]; then
          # snapshot mode never publishes, so signing would fail with no artifacts to sign
          [[ ",$SKIP," != *",sign,"* ]] && SKIP="${SKIP:+$SKIP,}sign"
          ARGS="release --clean --snapshot"
        else
          ARGS="release --clean"
        fi
        [ -n "$SKIP" ] && ARGS="$ARGS --skip=$SKIP"
        echo "args=$ARGS" >> "$GITHUB_OUTPUT"

    - uses: goreleaser/goreleaser-action@v7
      with:
        distribution: goreleaser
        version: latest
        args: ${{ steps.goreleaser-args.outputs.args }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SNAPCRAFT_STORE_CREDENTIALS: ${{ inputs.snapcraft-store-credentials }}
        CHOCOLATEY_API_KEY: ${{ inputs.chocolatey-api-key }}
        AUR_KEY: ${{ inputs.aur-key }}
        GORELEASER_CURRENT_TAG: ${{ inputs.goreleaser-current-tag }}
